name: CI/CD Workflow

on:
  push:
    branches: [master]
    paths:
      - 'source/**'
      - 'test/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
  pull_request:
    branches: [master, 'feature/**']
    paths:
      - 'source/**'
      - 'test/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
  release:
    types: [published]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for NuGet Trusted Publishing (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for version detection

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The dev CLI and runfiles target net11.0 (Amuru 3). The library, unit tests,
      # and AOT smoke multi-target net10.0 and net11.0, so CI needs both SDKs.
      # .NET 11 is pre-GA, so this step uses preview.
      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: NuGet login (OIDC Trusted Publishing)
        if: github.event_name == 'release'
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: TimeWarp.Enterprises

      # Cross-repo repository_dispatch (timewarp-software rebuild) cannot use the
      # default GITHUB_TOKEN. A short-lived installation token is minted from the
      # org's TimeWarp Rebuild Dispatcher GitHub App (org variable REBUILD_APP_ID +
      # org secret REBUILD_APP_PRIVATE_KEY). If the app is not configured the step
      # is skipped and the dispatch degrades to a warning (site rebuilds nightly).
      - name: Mint rebuild dispatch token
        if: github.event_name == 'release' && vars.REBUILD_APP_ID != ''
        id: rebuild-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REBUILD_APP_ID }}
          private-key: ${{ secrets.REBUILD_APP_PRIVATE_KEY }}
          owner: TimeWarpEngineering
          repositories: timewarp-software

      - name: Run CI Pipeline
        env:
          GH_TOKEN: ${{ steps.rebuild-token.outputs.token }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # pwsh does not fail the step when a native command exits non-zero; bash -e did.
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            dotnet run tools/dev-cli/dev.cs -- workflow --api-key $env:NUGET_API_KEY
          } else {
            dotnet run tools/dev-cli/dev.cs -- workflow
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/coverage
          if-no-files-found: error

      - name: AOT smoke test
        run: |
          # pwsh does not fail the step when a native command exits non-zero; bash -e did.
          foreach ($tfm in @('net10.0', 'net11.0')) {
            dotnet publish tests/timewarp-flexbox-aot-smoke/timewarp-flexbox-aot-smoke.csproj --configuration Release --framework $tfm -r linux-x64 -o "artifacts/aot-smoke/$tfm"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "./artifacts/aot-smoke/$tfm/TimeWarp.Flexbox.AotSmoke"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Packages-${{ github.run_number }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: ignore
